<script>
/**
 * CLIENT SIDE (JavaScript)
 */

let currentUser = null;
let users = [];
let agendaItems = [];
let chatMessages = [];
let ideas = [];
let photos = [];
let pinnedIds = new Set();
let allComments = [];

// 1. INITIALIZE
window.onload = function() {
  const saved = sessionStorage.getItem('byork_user');
  if (saved) {
    currentUser = saved;
    showApp();
  }
  refreshAllData();
};

/**
 * REFRESH: Replaces all the "sheetsGet" calls.
 * Uses google.script.run to talk to Code.gs
 */
function refreshAllData() {
  google.script.run
    .withSuccessHandler(function(data) {
      // Process Users
      users = data.users.slice(1).map(r => ({ name: r[0], hash: r[1] }));
      const sel = document.getElementById('login-name');
      const cur = sel.value;
      sel.innerHTML = '<option value="">— Select your name —</option>';
      users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.name; opt.textContent = u.name;
        sel.appendChild(opt);
      });
      sel.value = cur;

      // Map Data Arrays
      agendaItems = data.agenda.slice(1).map(r => ({ id: r[0], day: r[1], time: r[2], title: r[3], desc: r[4], emoji: r[5] }));
      chatMessages = data.chat.slice(1).map(r => ({ author: r[0], text: r[1], ts: r[2] }));
      ideas = data.ideas.slice(1).map(r => ({ id: r[0], author: r[1], text: r[2], ups: r[3]||0, downs: r[4]||0 }));
      photos = data.photos.slice(1).map(r => ({ id: r[0], uploader: r[1], caption: r[2], driveUrl: r[3] }));
      pinnedIds = new Set(data.pinned.slice(1).map(r => r[0]));
      allComments = data.comments.slice(1);

      // Trigger UI updates
      renderAgenda();
      renderChat();
      renderIdeas();
      renderPhotos();
    })
    .getAppData();
}

// 2. AUTHENTICATION
async function doLogin() {
  const name = document.getElementById('login-name').value;
  const pass = document.getElementById('login-password').value;
  const user = users.find(u => u.name === name);
  if (!user) return;
  
  const hash = await sha256(pass);
  if (hash === user.hash) {
    currentUser = name;
    sessionStorage.setItem('byork_user', name);
    showApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function doLogout() {
  sessionStorage.clear();
  location.reload();
}

// 3. EVENT HANDLERS (Write Operations)
function sendChat() {
  const input = document.getElementById('chat-input');
  if (!input.value.trim()) return;
  google.script.run.withSuccessHandler(refreshAllData).addChat({author: currentUser, text: input.value});
  input.value = '';
}

function submitComment(itemId) {
  const input = document.getElementById('comment-input-' + itemId);
  if (!input.value.trim()) return;
  google.script.run.withSuccessHandler(refreshAllData).addComment({itemId, author: currentUser, text: input.value});
  input.value = '';
}

function submitIdea() {
  const input = document.getElementById('idea-input');
  if (!input.value.trim()) return;
  google.script.run.withSuccessHandler(refreshAllData).addIdea({author: currentUser, text: input.value});
  input.value = '';
}

function vote(ideaId, direction) {
  google.script.run.withSuccessHandler(refreshAllData).vote({ideaId, direction});
}

function uploadPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  showToast('Uploading...');
  const reader = new FileReader();
  reader.onload = function(e) {
    google.script.run.withSuccessHandler(() => { showToast('Uploaded!'); refreshAllData(); })
      .uploadPhoto({
        uploader: currentUser,
        filename: file.name,
        mimeType: file.type,
        base64: e.target.result.split(',')[1],
        caption: prompt('Caption?') || ''
      });
  };
  reader.readAsDataURL(file);
}

function addAgendaItem() {
  const payload = {
    day: document.getElementById('admin-day').value,
    time: document.getElementById('admin-time').value,
    title: document.getElementById('admin-title').value,
    desc: document.getElementById('admin-desc').value,
    emoji: document.getElementById('admin-emoji').value
  };
  google.script.run.withSuccessHandler(() => { showToast('Added!'); refreshAllData(); }).addAgendaItem(payload);
}

// 4. RENDERING FUNCTIONS
function renderAgenda() {
  const el = document.getElementById('agenda-content');
  const days = ['Friday','Saturday','Sunday'];
  let html = '';
  days.forEach(day => {
    const items = agendaItems.filter(i => i.day === day);
    if (!items.length) return;
    html += `<div class="agenda-day-header">${day}</div>`;
    items.forEach(item => {
      const itemComments = allComments.filter(c => c[0] === item.id);
      html += `
        <div class="card">
          <div class="card-header">
            ${item.time ? `<span class="agenda-time">${item.time}</span>` : ''}
            <div class="card-title">${item.emoji} ${item.title}</div>
          </div>
          ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
          <div class="comments-section">
            <button class="comments-toggle" onclick="toggleComments('${item.id}')">
              💬 ${itemComments.length} Comments
            </button>
            <div class="comments-list" id="comments-${item.id}">
              <div id="comments-inner-${item.id}">
                ${itemComments.map(c => `<div class="comment-item"><div class="comment-author">${c[1]}</div><div class="comment-text">${escHtml(c[2])}</div></div>`).join('')}
              </div>
              <div class="comment-input-row">
                <input class="comment-input" id="comment-input-${item.id}" placeholder="Add a comment…" onkeydown="if(event.key==='Enter') submitComment('${item.id}')">
                <button class="btn-small" onclick="submitComment('${item.id}')">Post</button>
              </div>
            </div>
          </div>
        </div>`;
    });
  });
  el.innerHTML = html || '<p class="loading-msg">Nothing planned yet.</p>';
}

function renderChat() {
  const feed = document.getElementById('chat-feed');
  feed.innerHTML = chatMessages.map(m => `
    <div class="chat-message ${m.author === currentUser ? 'mine' : 'theirs'}">
      <div class="chat-bubble">${escHtml(m.text)}</div>
      <div class="chat-meta">${m.author === currentUser ? '' : m.author + ' · '}${formatTs(m.ts)}</div>
    </div>`).join('') || '<p class="loading-msg">No banter yet.</p>';
  feed.scrollTop = feed.scrollHeight;
}

function renderIdeas() {
  document.getElementById('ideas-list').innerHTML = ideas.map(idea => `
    <div class="idea-item">
      <div style="flex:1">
        <div class="idea-text">${escHtml(idea.text)}</div>
        <div class="idea-author">— ${idea.author}</div>
      </div>
      <button class="vote-btn" onclick="vote('${idea.id}', 'up')">👍 <span class="vote-count">${idea.ups}</span></button>
      <button class="vote-btn" onclick="vote('${idea.id}', 'down')">👎 <span class="vote-count">${idea.downs}</span></button>
    </div>`).join('') || '<p class="loading-msg">No ideas yet.</p>';
}

function renderPhotos() {
  document.getElementById('photo-grid').innerHTML = photos.map(p => `
    <div class="photo-item">
      <img src="${p.driveUrl}" onclick="openLightbox('${p.driveUrl}')">
      <div class="photo-caption">${escHtml(p.caption || p.uploader)}</div>
    </div>`).join('') || '<p class="loading-msg">No photos yet.</p>';
}

// 5. UTILS
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatTs(ts) { if(!ts) return ''; const d = new Date(ts); return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); }
function toggleComments(id) { document.getElementById('comments-'+id).classList.toggle('open'); }
function showSection(id, btn) {
  document.querySelectorAll('.section, .nav-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('section-'+id).classList.add('active');
  btn.classList.add('active');
}
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('header-username').textContent = currentUser;
  if (currentUser === 'Bob') document.getElementById('admin-tab').style.display = 'inline-block';
}
function openLightbox(url) { document.getElementById('lightbox-img').src = url; document.getElementById('lightbox').classList.add('open'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }
</script>
